name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Multi-Arch Static Binaries
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/omacorn-linux-amd64 .
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/omacorn-linux-arm64 .

      - name: Package Release Bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          
          # Package amd64 bundle
          mkdir -p omacorn-${VERSION}-linux-amd64
          cp omacorn-linux-amd64 omacorn-${VERSION}-linux-amd64/omacorn
          cp ../scripts/install.sh omacorn-${VERSION}-linux-amd64/
          cp ../config/20-omacorn-proxy.conf omacorn-${VERSION}-linux-amd64/
          cp ../README.md omacorn-${VERSION}-linux-amd64/
          tar -czf omacorn-${VERSION}-linux-amd64.tar.gz omacorn-${VERSION}-linux-amd64
          
          # Package arm64 bundle
          mkdir -p omacorn-${VERSION}-linux-arm64
          cp omacorn-linux-arm64 omacorn-${VERSION}-linux-arm64/omacorn
          cp ../scripts/install.sh omacorn-${VERSION}-linux-arm64/
          cp ../config/20-omacorn-proxy.conf omacorn-${VERSION}-linux-arm64/
          cp ../README.md omacorn-${VERSION}-linux-arm64/
          tar -czf omacorn-${VERSION}-linux-arm64.tar.gz omacorn-${VERSION}-linux-arm64
          
          # Generate SHA256 Checksums
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            scripts/install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
